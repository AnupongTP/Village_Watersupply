<!doctype html>
<meta charset="utf-8">
<title>QA Candidate Loader</title>
<body><p id="status">Loading exact frozen candidate…</p>
<script>
(async()=>{
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbyJjBCkGlQHxBeA7jdYy5rA-KBiDE73t3E0M36SIFDfrs2asCKwk11TQaWQrlRMqsXzPQ/exec';
const SOURCES={
 html:{url:'assets/source/index.html.gz.b64.txt',sha:'265545664ed8b374809072077f36a17fb57de304715b7678657ab8e4595ca7f4'},
 js:{url:'assets/source/technician.js.gz.b64.txt',sha:'de2b7a3f6fd86dde45b7fde39f849fbb4f692c9b72e9669fb7996c9f2b953357'},
 css:{url:'assets/source/technician.css.gz.b64.txt',sha:'b0650ddcd3ab11adf3e2c4b84f333e7a9bbc67395e79b4a55cc98bee699c501a'}
};
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function source(spec){
 const r=await fetch(spec.url+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('source fetch '+r.status+' '+spec.url);
 const b64=(await r.text()).trim(); const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const ds=new DecompressionStream('gzip'); const data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
 const actual=hex(await crypto.subtle.digest('SHA-256',data)); if(actual!==spec.sha)throw new Error('SHA256 mismatch '+spec.url+' '+actual);
 return new TextDecoder().decode(data);
}
function replaceExactlyOnce(text,needle,replacement,label){
 const first=text.indexOf(needle); if(first<0)throw new Error('missing '+label+' marker');
 if(text.indexOf(needle,first+needle.length)>=0)throw new Error('duplicate '+label+' marker');
 return text.slice(0,first)+replacement+text.slice(first+needle.length);
}
try{
 sessionStorage.removeItem('vws_management_token_v2');
 const [html,js,css]=await Promise.all([source(SOURCES.html),source(SOURCES.js),source(SOURCES.css)]);
 const closeScript='</scr'+'ipt>';
 const closeStyle='</sty'+'le>';
 const configNeedle='<script src="assets/config.js" defer>'+closeScript;
 const technicianNeedle='<script src="assets/technician.js" defer>'+closeScript;
 const cssNeedle='<link rel="stylesheet" href="assets/technician.css">';
 const cssTag='<style data-qa-source-sha="'+SOURCES.css.sha+'">'+css+closeStyle;
 const cfg='<script>window.VWS_MANAGEMENT_CONFIG=Object.freeze({endpoint:'+JSON.stringify(ENDPOINT)+'});sessionStorage.removeItem("vws_management_token_v2");'+closeScript;
 const jsTag='<script data-qa-source-sha="'+SOURCES.js.sha+'">'+js+closeScript;
 let transformed=replaceExactlyOnce(html,cssNeedle,cssTag,'technician CSS');
 transformed=replaceExactlyOnce(transformed,configNeedle,cfg,'config script');
 transformed=replaceExactlyOnce(transformed,technicianNeedle,jsTag,'technician script');
 if(/assets\/(?:config|technician)\.(?:js|css)/.test(transformed))throw new Error('candidate external asset marker remained after transform');
 const verify='<script>window.__QA_CANDIDATE_SOURCE_VERIFIED='+JSON.stringify({html:SOURCES.html.sha,js:SOURCES.js.sha,css:SOURCES.css.sha})+';'+closeScript;
 transformed=replaceExactlyOnce(transformed,'</body>',verify+'</body>','body close');
 document.open(); document.write(transformed); document.close();
}catch(e){
 window.__QA_CANDIDATE_LOAD_ERROR=String(e&&e.message||e); document.getElementById('status').textContent='LOAD FAIL: '+window.__QA_CANDIDATE_LOAD_ERROR; console.error(e);
}
})();
</script>
