<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CP-M3 Technician Transport Spike</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px; font: inherit; }
    button { margin-top: 16px; padding: 10px 16px; font: inherit; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f4f4; padding: 12px; border-radius: 8px; }
    .pass { color: #166534; }
    .fail { color: #991b1b; }
    .warn { color: #92400e; }
    .muted { color: #475569; }
  </style>
</head>
<body>
  <h1>CP-M3 Transport Spike</h1>
  <p class="muted">ใช้เพื่อพิสูจน์ GitHub Pages → Apps Script เท่านั้น หน้า test นี้ไม่เก็บ endpoint, username หรือ password ลง localStorage</p>

  <form id="spikeForm" autocomplete="off">
    <label for="endpoint">Apps Script Web App /exec</label>
    <input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">

    <label for="username">ADMIN username</label>
    <input id="username" type="text" required autocomplete="username">

    <label for="password">ADMIN password</label>
    <input id="password" type="password" required autocomplete="current-password">

    <button id="runButton" type="submit">Run CP-M3 Full Transport Test</button>
  </form>

  <h2>ผล</h2>
  <div id="summary" class="muted">ยังไม่ได้ทดสอบ</div>
  <pre id="log" aria-live="polite"></pre>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'mgmt_cp_m3_token';
  const form = document.getElementById('spikeForm');
  const endpointInput = document.getElementById('endpoint');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const runButton = document.getElementById('runButton');
  const summary = document.getElementById('summary');
  const log = document.getElementById('log');

  function safeLine(message) {
    log.textContent += String(message) + '\n';
  }

  function setSummary(kind, text) {
    summary.className = kind;
    summary.textContent = text;
  }

  function endpointLooksValid(url) {
    return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/i.test(url);
  }

  async function post(endpoint, action, payload) {
    const startedAt = performance.now();
    let response;
    try {
      response = await fetch(endpoint, {
        method: 'POST',
        mode: 'cors',
        credentials: 'omit',
        redirect: 'follow',
        cache: 'no-store',
        referrerPolicy: 'no-referrer',
        headers: {
          'Content-Type': 'text/plain;charset=UTF-8'
        },
        body: JSON.stringify({ version: 1, action, payload: payload || {} })
      });
    } catch (error) {
      const wrapped = new Error('NETWORK_OR_CORS_BLOCK');
      wrapped.causeText = error && error.message ? String(error.message) : String(error);
      throw wrapped;
    }

    const elapsedMs = Math.round(performance.now() - startedAt);
    const responseInfo = {
      status: response.status,
      ok: response.ok,
      type: response.type,
      redirected: response.redirected,
      finalHost: (() => {
        try { return new URL(response.url).host; } catch (_) { return ''; }
      })(),
      elapsedMs
    };

    let text;
    try {
      text = await response.text();
    } catch (error) {
      const wrapped = new Error('RESPONSE_NOT_READABLE');
      wrapped.responseInfo = responseInfo;
      wrapped.causeText = error && error.message ? String(error.message) : String(error);
      throw wrapped;
    }

    let json;
    try {
      json = JSON.parse(text);
    } catch (_) {
      const wrapped = new Error('NON_JSON_RESPONSE');
      wrapped.responseInfo = responseInfo;
      wrapped.sample = text.slice(0, 160).replace(/\s+/g, ' ');
      throw wrapped;
    }

    return { json, responseInfo };
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    sessionStorage.removeItem(STORAGE_KEY);
    log.textContent = '';
    setSummary('muted', 'กำลังทดสอบ...');
    runButton.disabled = true;

    const endpoint = endpointInput.value.trim();
    const username = usernameInput.value.trim();
    let password = passwordInput.value;
    passwordInput.value = '';

    const checks = [];
    function check(name, condition, detail) {
      checks.push({ name, pass: Boolean(condition), detail: detail || '' });
      safeLine((condition ? 'PASS ' : 'FAIL ') + name + (detail ? ' — ' + detail : ''));
      if (!condition) throw new Error('ASSERTION_FAILED:' + name);
    }

    try {
      check('endpoint uses deployed /exec URL', endpointLooksValid(endpoint));
      check('username present', Boolean(username));
      check('password present for this run', Boolean(password));

      safeLine('');
      safeLine('1) transport.ping');
      const ping = await post(endpoint, 'transport.ping', {});
      check('browser can read ping JSON', ping.json && ping.json.success === true,
        'status=' + ping.responseInfo.status + ', type=' + ping.responseInfo.type + ', redirected=' + ping.responseInfo.redirected + ', finalHost=' + ping.responseInfo.finalHost);
      check('transport version = 1', ping.json.data && ping.json.data.transportVersion === 1);

      safeLine('');
      safeLine('2) auth.login');
      const login = await post(endpoint, 'auth.login', {
        username,
        password,
        clientInfo: 'CP-M3 GitHub transport spike | ' + navigator.userAgent.slice(0, 300)
      });
      password = '';
      check('login success', login.json && login.json.success === true,
        login.json && login.json.error ? login.json.error.code : '');

      const token = login.json && login.json.data && typeof login.json.data.token === 'string'
        ? login.json.data.token
        : '';
      check('login returned opaque session token', /^MGT-[0-9a-f]{64}$/i.test(token));
      sessionStorage.setItem(STORAGE_KEY, token);
      check('session token stored only in sessionStorage for spike', sessionStorage.getItem(STORAGE_KEY) === token);

      // Never print the token. Only report its presence/format.
      safeLine('');
      safeLine('3) auth.me');
      const me = await post(endpoint, 'auth.me', { token: sessionStorage.getItem(STORAGE_KEY) || '' });
      check('me success', me.json && me.json.success === true,
        me.json && me.json.error ? me.json.error.code : '');
      check('me returns sanitized user', Boolean(me.json && me.json.data && me.json.data.user));
      check('me response contains no password field', JSON.stringify(me.json).indexOf('"password"') === -1);

      safeLine('');
      safeLine('4) auth.logout');
      const logout = await post(endpoint, 'auth.logout', { token: sessionStorage.getItem(STORAGE_KEY) || '' });
      check('logout success', logout.json && logout.json.success === true);

      safeLine('');
      safeLine('5) revoked-token check');
      const afterLogout = await post(endpoint, 'auth.me', { token: sessionStorage.getItem(STORAGE_KEY) || '' });
      check(
        'revoked token rejected',
        afterLogout.json && afterLogout.json.success === false && afterLogout.json.error && afterLogout.json.error.code === 'SESSION_REVOKED',
        afterLogout.json && afterLogout.json.error ? afterLogout.json.error.code : ''
      );

      sessionStorage.removeItem(STORAGE_KEY);
      check('sessionStorage token cleared after spike', sessionStorage.getItem(STORAGE_KEY) === null);

      const passed = checks.filter(item => item.pass).length;
      setSummary('pass', 'CP-M3 OPTION A PASS — ' + passed + '/' + checks.length + ' checks ผ่าน');
      safeLine('');
      safeLine('DECISION: DIRECT_GITHUB_TO_APPS_SCRIPT is technically viable for the tested deployment/origin.');
    } catch (error) {
      sessionStorage.removeItem(STORAGE_KEY);
      password = '';

      safeLine('');
      if (error && error.message === 'NETWORK_OR_CORS_BLOCK') {
        safeLine('FAIL CLASS: NETWORK_OR_CORS_BLOCK');
        safeLine('Browser error: ' + (error.causeText || '-'));
        safeLine('DECISION: อย่าเลือก Option A จากผลนี้; ต้องใช้ Option B หรือแก้ transport แล้วทดสอบใหม่');
      } else if (error && error.message === 'NON_JSON_RESPONSE') {
        safeLine('FAIL CLASS: NON_JSON_RESPONSE');
        safeLine('HTTP: ' + JSON.stringify(error.responseInfo || {}));
        safeLine('Response sample: ' + (error.sample || '-'));
        safeLine('มักเกิดจาก deployment/access/login page หรือ endpoint ไม่ใช่ deployment ที่มี doPost รุ่นนี้');
      } else if (error && error.message === 'RESPONSE_NOT_READABLE') {
        safeLine('FAIL CLASS: RESPONSE_NOT_READABLE');
        safeLine('HTTP: ' + JSON.stringify(error.responseInfo || {}));
      } else {
        safeLine('FAIL CLASS: ' + (error && error.message ? error.message : 'UNKNOWN'));
      }
      setSummary('fail', 'CP-M3 OPTION A ยังไม่ผ่าน — ดูรายละเอียดด้านล่าง');
    } finally {
      runButton.disabled = false;
    }
  });
})();
</script>
</body>
</html>
