name: Restore frozen technician production source

on:
  push:
    branches:
      - release/mgmt-v2-technician-production-20260830

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[restored-technician]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct exact frozen Technician source and verify hashes
        shell: bash
        env:
          PROD_ENDPOINT: https://script.google.com/macros/s/AKfycbz8zLg7qFhh3tchDIyalPxo-pmx1_ok2Wyi_FtMjY_W8NUOTbjVV6vwGlxY3yzYG-aY/exec
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess

          source_commit = '59d25bb1cc2d63f37180a4f5436caa223ba4d501'
          specs = {
              'index.html': (
                  'qa-browser-harness-candidate/assets/source/index.html.gz.b64.txt',
                  'technician/index.html',
                  '265545664ed8b374809072077f36a17fb57de304715b7678657ab8e4595ca7f4',
              ),
              'technician.js': (
                  'qa-browser-harness-candidate/assets/source/technician.js.gz.b64.txt',
                  'technician/assets/technician.js',
                  'de2b7a3f6fd86dde45b7fde39f849fbb4f692c9b72e9669fb7996c9f2b953357',
              ),
              'technician.css': (
                  'qa-browser-harness-candidate/assets/source/technician.css.gz.b64.txt',
                  'technician/assets/technician.css',
                  'b0650ddcd3ab11adf3e2c4b84f333e7a9bbc67395e79b4a55cc98bee699c501a',
              ),
          }

          for name, (src, dst, expected) in specs.items():
              encoded = subprocess.check_output(['git', 'show', f'{source_commit}:{src}'])
              raw = gzip.decompress(base64.b64decode(encoded.strip()))
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{name} SHA mismatch: {actual} != {expected}')
              path = pathlib.Path(dst)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              print(f'PASS {name} {actual}')

          endpoint = os.environ['PROD_ENDPOINT'].strip()
          if not (endpoint.startswith('https://script.google.com/macros/s/') and endpoint.endswith('/exec') and '?' not in endpoint and '#' not in endpoint):
              raise SystemExit('Production endpoint format invalid')
          pathlib.Path('technician/assets/config.js').write_text(
              "window.VWS_MANAGEMENT_CONFIG = Object.freeze({\n"
              "  // Production KebNamComplete Apps Script /exec endpoint.\n"
              f"  endpoint: '{endpoint}'\n"
              "});\n",
              encoding='utf-8',
              newline='\n',
          )

          pinned = {
              'index.html': '6d218c59e9dc2aa9d85836c8f722909ce766ffe8',
              'assets/css/tailwind.css': 'b177442e3e6299eb53fef012f8521f94f7007604',
              'assets/css/app.css': '3a742873fa42a377cb0c41c6c3328617e876c46d',
              'assets/js/drawer.js': '1f7b9ee8dc7d66de028a56d402666f5773ada408',
              'assets/js/system-detail.js': '91251dda5b6c41543469e1501f3890e7144b49f8',
          }
          for path, expected in pinned.items():
              actual = subprocess.check_output(['git','rev-parse',f'HEAD:{path}'], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'Public baseline changed at {path}: {actual} != {expected}')
              print(f'PASS public {path} {actual}')
          PY

          node --check technician/assets/technician.js
          git diff --check

      - name: Commit restored Technician source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add technician/
          git diff --cached --quiet && exit 0
          git commit -m 'release: publish frozen Management v2 Technician UI [restored-technician]'
          git push origin HEAD:release/mgmt-v2-technician-production-20260830
