name: Real Apps Script Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only real API + browser smoke
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_API_URL: ${{ secrets.APPS_SCRIPT_API_URL }}
      REAL_API: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Require API secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPS_SCRIPT_API_URL:-}" ]; then
            echo "APPS_SCRIPT_API_URL secret is missing."
            exit 1
          fi

      - name: Install locked project dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || { echo "package-lock.json is required. Run the Generate npm lockfile workflow once and commit the artifact."; exit 1; }
          npm ci --no-audit --no-fund

      - name: Build Tailwind production CSS
        run: npm run build:css

      - name: Direct read-only API schema smoke test
        run: npm run api:smoke

      - name: Prepare real API browser config
        run: npm run prepare:test:real

      - name: Install Chromium and Linux dependencies
        run: npx playwright install chromium --with-deps

      - name: Run real API browser smoke test
        run: npx playwright test tests/e2e/real-api.spec.js --project=chromium-desktop
        env:
          CI: 'true'
          REAL_API: '1'

      - name: Upload browser report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: real-api-smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
